<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SKR Overlays · Chase the Ace</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --muted: rgba(255,255,255,.55); --row: rgba(6,12,26,.80); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: "Rajdhani", sans-serif; color: #fff; }
  #wrap { position: absolute; inset: 110px 120px 60px; display: grid; gap: 40px; }
  .col { display: flex; flex-direction: column; }
  .head { display: flex; align-items: flex-end; gap: 22px; padding: 0 8px 14px; margin-bottom: 16px;
          border-bottom: 4px solid transparent; border-image: linear-gradient(90deg, var(--a), var(--b)) 1; }
  .ace { width: 70px; height: 92px; border-radius: 10px; background: #fff; color: #0a1020; display: grid; place-items: center;
         font-family: "Orbitron"; font-weight: 900; font-size: 40px; box-shadow: 0 8px 26px rgba(0,0,0,.5); transform: rotate(-6deg); }
  .head h2 { margin: 0; font-family: "Orbitron"; font-weight: 900; font-size: 58px; line-height: .95; letter-spacing: 2px;
             background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; color: transparent; }
  .head h2 small { display: block; font-size: 22px; letter-spacing: .3em; color: #fff; -webkit-text-fill-color: #fff; margin-bottom: 6px; }
  .head .info { margin-left: auto; text-align: right; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .head .info small { display: block; font-size: 18px; color: var(--muted); }
  .head .info b { font-family: "Orbitron"; font-size: 34px; }
  .lbl, .row { display: grid; grid-template-columns: 90px 1fr var(--wcol, 190px) var(--rcol, 440px) 130px; align-items: center; }
  .lbl { padding: 0 22px 8px 10px; font-size: 17px; font-weight: 700; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
  .lbl span:last-child, .sum { text-align: right; }
  .rows { display: flex; flex-direction: column; gap: 12px; }
  .row { position: relative; height: 104px; padding: 0 22px 0 10px; border-radius: 16px; background: var(--row);
         border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 22px rgba(0,0,0,.4); overflow: hidden; }
  .row.lead { background: linear-gradient(90deg, color-mix(in srgb, var(--a) 28%, rgba(6,12,26,.84)), rgba(6,12,26,.82) 65%);
              border-color: color-mix(in srgb, var(--a) 60%, transparent); }
  .row.champ { background: linear-gradient(90deg, rgba(255,200,40,.45), rgba(6,12,26,.82) 70%); border-color: #ffd23f; }
  .row.champ::after, .row.lead::after { content: ""; position: absolute; inset: 0; pointer-events: none;
     background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.16) 48%, transparent 60%) -150% 0 / 250% 100% no-repeat;
     animation: sheen 4s ease-in-out infinite; }
  @keyframes sheen { 0% { background-position: -150% 0; } 55%,100% { background-position: 250% 0; } }
  .pos { width: 72px; height: 72px; border-radius: 14px; display: grid; place-items: center; font-family: "Orbitron";
         font-weight: 900; font-size: 36px; background: rgba(255,255,255,.08); }
  .row.lead .pos { background: linear-gradient(135deg, var(--a), var(--b)); color: #0a0f1c; }
  .row.champ .pos { background: linear-gradient(135deg, #ffe46b, #ffb321); color: #1a1000; }
  .name b { display: block; font-family: "Orbitron"; font-weight: 800; font-size: 40px; text-transform: uppercase;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .name small { display: block; margin-top: 4px; font-size: 18px; font-weight: 700; letter-spacing: .14em; color: #ffd23f; text-transform: uppercase; }
  .wins { display: flex; gap: 12px; }
  .card { width: 50px; height: 66px; border-radius: 8px; border: 2px dashed rgba(255,255,255,.28); display: grid; place-items: center;
          font-family: "Orbitron"; font-weight: 900; font-size: 26px; color: transparent; }
  .card.on { border: 0; background: #fff; color: #0a1020; box-shadow: 0 0 22px color-mix(in srgb, var(--a) 80%, transparent); }
  .row.champ .card.on { box-shadow: 0 0 26px rgba(255,210,63,.9); }
  .races { display: flex; gap: 10px; }
  .chip { width: 72px; height: 54px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.07);
          font-family: "Orbitron"; font-weight: 800; font-size: 24px; color: rgba(255,255,255,.35); }
  .chip.r1 { background: linear-gradient(135deg, var(--a), var(--b)); color: #0a0f1c; }
  .chip.r2 { background: rgba(255,255,255,.22); color: #fff; }
  .chip.r3, .chip.r4 { background: rgba(255,255,255,.12); color: #fff; }
  .chip.void { background: repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 8px, transparent 8px 16px); color: rgba(255,255,255,.45); }
  .iron { display: inline-block; margin-left: 14px; padding: 2px 10px; border-radius: 8px; font-size: 16px; letter-spacing: .14em; background: rgba(255,255,255,.12); color: #fff; vertical-align: middle; }
  .sum { font-family: "Orbitron"; font-weight: 900; font-size: 44px; }
  .banner { margin-top: 22px; padding: 18px 26px; border-radius: 16px; text-align: center; font-family: "Orbitron"; font-weight: 900;
            font-size: 34px; letter-spacing: 3px; background: linear-gradient(90deg, rgba(255,210,63,.25), rgba(255,140,40,.25));
            border: 2px solid #ffd23f; text-transform: uppercase; }
  .rule { margin-top: 18px; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
</style>
</head>
<body>
<div id="wrap"></div>
<script src="/skr/static/common.js"></script>
<script>
// Parámetros: clases=actual|4|4,5 · titulos=PRO,SPORT · subtitulo=... · paleta=ffb321-ff6a3d,2bb5f5-6a5cff
//             aces=2 (solo si la clase no usa el ranking de chase_the_ace_rank) · lang · intervalo
const { t, esc, qs } = RO;
const TITLES = RO.list('titulos');
const PALETTE = RO.palette('paleta', ['ffb321-ff6a3d', '2bb5f5-6a5cff', '22d63a-0fb5a0']);
const url = '/skr/chase.json?clases=' + encodeURIComponent(qs.get('clases') || 'actual') + (qs.get('aces') ? '&aces=' + encodeURIComponent(qs.get('aces')) : '');

RO.poll(url, (data) => {
  const cls = data.classes || [];
  const wrap = document.getElementById('wrap');
  wrap.style.gridTemplateColumns = cls.length > 1 ? '1fr 1fr' : '1fr';
  wrap.innerHTML = cls.map((c, ci) => {
    const [a, b] = PALETTE[ci % PALETTE.length];
    const title = (TITLES && TITLES[ci]) || c.name.split(' - ')[0].toUpperCase();
    const need = c.wins_needed || 2;
    const max = Math.max(c.max_races || 5, c.races);
    const maxW = Math.max(0, ...c.pilots.map((p) => p.wins));
    const rows = c.pilots.map((p) => {
      const cards = Array.from({ length: need }, (_, i) => `<div class="card${p.wins > i ? ' on' : ''}">A♠</div>`).join('');
      const chips = Array.from({ length: max }, (_, i) => {
        const r = p.results[i];
        if (r === 0) return `<div class="chip void" title="${esc(t('void'))}">✕</div>`;
        return `<div class="chip${r ? ' r' + r : ''}">${r ? r + 'º' : '·'}</div>`;
      }).join('');
      const lead = !c.champion && p.wins > 0 && p.wins === maxW;
      const note = p.champion ? `<small>${t('champion')}</small>`
        : (p.wins > 0 && p.wins === need - 1 && !c.champion ? `<small>${t('one_more')}</small>` : '');
      return `<div class="row${p.champion ? ' champ' : (lead ? ' lead' : '')}">
        <div class="pos">${p.position ?? '—'}</div>
        <div class="name"><b>${esc(p.callsign)}</b>${note}</div>
        <div class="wins">${cards}</div>
        <div class="races">${chips}</div>
        <div class="sum">${p.sum ?? '—'}</div>
      </div>`;
    }).join('');
    const foot = c.champion
      ? `<div class="banner">${esc(t('champion_banner', c.champion))}</div>`
      : `<div class="rule">${t('chase_rule', need)}${c.void_races && c.void_races.length ? ' · ✕ = ' + t('void') : ''}</div>`;
    const iron = c.ironman === 'active' ? `<span class="iron">IRONMAN</span>` : '';
    return `<section class="col" style="--a:${esc(a)};--b:${esc(b || a)};--wcol:${need * 62 + 66}px;--rcol:${max * 82 + 30}px">
      <div class="head"><div class="ace">A♠</div><h2><small>${esc(qs.get('subtitulo') || t('chase_title'))}${iron}</small>${esc(title)}</h2>
        <div class="info"><small>${t('race')}</small><b>${c.races}/${max}</b></div></div>
      <div class="lbl"><span>${t('pos')}</span><span>${t('pilot')}</span><span>${t('aces')}</span><span>${t('races_n', max)}</span><span>${t('sum')}</span></div>
      <div class="rows">${rows}</div>${foot}
    </section>`;
  }).join('');
});
</script>
</body>
</html>
