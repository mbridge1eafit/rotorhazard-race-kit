<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SKR Overlays · Nodes</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: "Rajdhani", sans-serif; color: #fff; }
  #grid { position: absolute; inset: 0; display: grid; }
  .cell { position: relative; overflow: hidden; }
  .hud { position: absolute; display: flex; align-items: flex-start; gap: calc(14px * var(--s)); transform-origin: top left;
         top: calc(18px * var(--s)); left: calc(18px * var(--s)); }
  .cell.r .hud { left: auto; right: calc(18px * var(--s)); flex-direction: row-reverse; text-align: right; }
  .cell.b .hud { top: auto; bottom: calc(18px * var(--s)); align-items: flex-end; }
  /* posición: recuadro con el color del puesto, brillo que late y reflejo */
  .pos { min-width: calc(86px * var(--s)); height: calc(86px * var(--s)); padding: 0 calc(10px * var(--s)); box-sizing: border-box;
         display: grid; place-items: center; border-radius: calc(16px * var(--s));
         font-family: "Orbitron"; font-weight: 900; font-size: calc(54px * var(--s)); line-height: 1;
         background:
           linear-gradient(115deg, transparent 30%, rgba(255,255,255,.22) 45%, transparent 60%) -150% 0 / 250% 100% no-repeat,
           linear-gradient(135deg, color-mix(in srgb, var(--c) 45%, transparent), rgba(8,12,24,.70) 75%);
         border: calc(3px * var(--s)) solid color-mix(in srgb, var(--c) 85%, white);
         text-shadow: 0 0 14px var(--c), 0 2px 4px rgba(0,0,0,.9); backdrop-filter: blur(4px);
         animation: pulse 2.4s ease-in-out infinite, sheen 3.6s ease-in-out 1s infinite; }
  .pos sup { font-size: .45em; vertical-align: top; margin-left: 2px; color: color-mix(in srgb, var(--c) 70%, white); text-shadow: none; }
  .pos.none { opacity: .55; animation: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 6px 0 color-mix(in srgb, var(--c) 60%, transparent), 0 6px 18px rgba(0,0,0,.45); }
                     50% { box-shadow: 0 0 26px 6px color-mix(in srgb, var(--c) 70%, transparent), 0 6px 18px rgba(0,0,0,.45); } }
  @keyframes sheen { 0% { background-position: -150% 0, 0 0; } 60%,100% { background-position: 250% 0, 0 0; } }
  .info { display: flex; flex-direction: column; gap: calc(6px * var(--s)); padding: calc(8px * var(--s)) calc(14px * var(--s));
          border-radius: calc(12px * var(--s)); background: rgba(6,10,22,.72); border-left: calc(5px * var(--s)) solid var(--c); }
  .cell.r .info { border-left: 0; border-right: calc(5px * var(--s)) solid var(--c); }
  .name { font-family: "Orbitron"; font-weight: 900; font-size: calc(34px * var(--s)); line-height: 1; text-transform: uppercase;
          white-space: nowrap; text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .line { display: flex; gap: calc(12px * var(--s)); align-items: baseline; font-weight: 700; font-size: calc(20px * var(--s));
          letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.75); white-space: nowrap; }
  .cell.r .line { justify-content: flex-end; }
  .line b { font-family: "Orbitron"; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
  .ch b { color: var(--c); filter: brightness(1.3); text-shadow: 0 0 10px var(--c); }
  .laps b { font-size: 1.25em; }
  .done { color: #ffd23f; }
  .flash .info { animation: flash .9s ease-out; }
  @keyframes flash { 0% { background: color-mix(in srgb, var(--c) 70%, rgba(6,10,22,.72)); } 100% { background: rgba(6,10,22,.72); } }
</style>
</head>
<body>
<div id="grid"></div>
<script src="/skr/static/common.js"></script>
<script>
// Parámetros: nodos=1,2,3,4 (puestos, empiezan en 1) · disposicion=2x2 (columnas x filas; 1x1 = un solo nodo)
//             esquina=arriba-izq|arriba-der|abajo-izq|abajo-der · escala=1 · mostrar=pos,canal,vueltas,ultima,mejor
//             colores=... · lang · intervalo=500
const { t, esc, qs } = RO;
const NODES = (RO.list('nodos') || ['1', '2', '3', '4']).map((n) => Number(n) - 1).filter((n) => n >= 0);
const [COLS, ROWS] = (qs.get('disposicion') || (NODES.length === 1 ? '1x1' : '2x2')).split('x').map(Number);
const corner = (qs.get('esquina') || 'arriba-izq').toLowerCase();
const SHOW = new Set(RO.list('mostrar') || ['pos', 'canal', 'vueltas', 'ultima', 'mejor']);
const grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${COLS || 2}, 1fr)`;
grid.style.gridTemplateRows = `repeat(${ROWS || 2}, 1fr)`;
document.body.style.setProperty('--s', RO.num('escala', 1));
const cells = NODES.map(() => {
  const d = document.createElement('div');
  d.className = 'cell' + (corner.includes('der') || corner.includes('right') ? ' r' : '') + (corner.includes('abajo') || corner.includes('bottom') ? ' b' : '');
  grid.appendChild(d);
  return d;
});
const lastLaps = {};

RO.poll('/skr/carrera.json', (data) => {
  const colors = RO.seatColors(data);
  const racing = data.status === 'racing' || data.status === 'done';
  NODES.forEach((n, i) => {
    const cell = cells[i];
    const s = (data.seats || [])[n];
    if (!s || !s.active) { cell.innerHTML = ''; return; }
    cell.style.setProperty('--c', colors[n % colors.length]);
    const pos = s.position ? `<span>${s.position}<sup>${t('ordinal')}</sup></span>` : '—';
    const lapsTxt = data.laps_to_win ? `${s.laps}/${data.laps_to_win}` : `${s.laps}`;
    const parts = [];
    if (SHOW.has('canal') && s.channel) parts.push(`<span class="ch">${t('channel')} <b>${esc(s.channel)}</b></span>`);
    if (racing && SHOW.has('vueltas')) parts.push(`<span class="laps">${t('laps')} <b>${lapsTxt}</b></span>`);
    if (racing && s.finished) parts.push(`<span class="done">✓ ${t('finished')}</span>`);
    const times = [];
    if (racing && SHOW.has('ultima') && s.last_lap) times.push(`<span>${t('last')} <b>${esc(s.last_lap)}</b></span>`);
    if (racing && SHOW.has('mejor') && s.fastest_lap) times.push(`<span>${t('best')} <b>${esc(s.fastest_lap)}</b></span>`);
    cell.innerHTML = `<div class="hud">
      ${SHOW.has('pos') ? `<div class="pos${s.position ? '' : ' none'}">${pos}</div>` : ''}
      <div class="info"><div class="name">${esc(s.callsign)}</div>
        ${parts.length ? `<div class="line">${parts.join('')}</div>` : ''}
        ${times.length ? `<div class="line">${times.join('')}</div>` : ''}</div></div>`;
    if (lastLaps[n] !== undefined && s.laps > lastLaps[n]) {
      cell.classList.remove('flash'); void cell.offsetWidth; cell.classList.add('flash');
    }
    lastLaps[n] = s.laps;
  });
}, 500);
</script>
</body>
</html>
